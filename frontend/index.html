<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeOS AI — Intelligent Personal Life & Schedule Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-focus: #6366f1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-border: #c7d2fe;
      
      --success: #10b981;
      --success-light: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #047857;
      
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --warning-border: #fde68a;
      --warning-text: #b45309;
      
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;

      --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.45) 1px, transparent 1px);
      background-size: 32px 32px;
      min-height: 100vh;
    }

    body.large-text { font-size: 18px; }

    /* Typography */
    h1, h2, h3, h4 {
      color: var(--text-main);
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    h1 { font-size: 2.25rem; line-height: 1.2; }
    h2 { font-size: 1.5rem; line-height: 1.25; }
    h3 { font-size: 1.15rem; font-weight: 600; }
    p { color: var(--text-muted); font-size: 0.95rem; }

    /* Buttons & Interactive */
    button, input, select, textarea { font-family: inherit; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      background: var(--surface-subtle);
      border-color: #cbd5e1;
    }
    .btn-success {
      background: var(--success);
      color: #ffffff;
    }
    .btn-success:hover {
      filter: brightness(0.95);
    }
    .btn-danger {
      background: var(--danger-light);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    /* Forms */
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    /* Minimalist Grid Layout */
    .grid { display: grid; gap: 20px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row { display: flex; align-items: center; gap: 12px; }
    .row-sp { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* Minimalist Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .card-metric {
      padding: 18px 20px;
      background: var(--surface);
    }
    .metric-value {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }

    /* Badges & Tags */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      line-height: 1.2;
    }
    .badge-primary { background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary-border); }
    .badge-success { background: var(--success-light); color: var(--success-text); border: 1px solid var(--success-border); }
    .badge-warning { background: var(--warning-light); color: var(--warning-text); border: 1px solid var(--warning-border); }
    .badge-danger { background: var(--danger-light); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .badge-neutral { background: var(--surface-subtle); color: var(--text-muted); border: 1px solid var(--border); }

    /* Application Shell */
    .app-container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding-left: 6px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      background: var(--text-main);
      color: #fff;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: none;
      cursor: pointer;
      text-align: left;
      margin-bottom: 4px;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      color: var(--text-main);
      background: var(--surface-subtle);
    }
    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-light);
      border-color: var(--primary-border);
    }
    .main-content {
      flex: 1;
      padding: 32px 40px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* Schedule Items */
    .schedule-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .schedule-item:hover {
      border-color: #cbd5e1;
      background: #fafafa;
    }
    .schedule-item.is-done {
      opacity: 0.55;
      background: var(--surface-subtle);
    }
    .schedule-item.is-done .item-title {
      text-decoration: line-through;
    }
    .item-time {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 80px;
    }

    /* Modal Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 999;
    }
    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: min(480px, 100%);
      padding: 28px;
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Alert Banner */
    .alert-banner {
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .alert-warning {
      background: var(--warning-light);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
    }
    .alert-info {
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary);
    }

    /* Chat Messages */
    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .chat-user {
      margin-left: auto;
      background: var(--primary);
      color: #fff;
    }
    .chat-ai {
      margin-right: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    /* Toast */
    #toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-main);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 1000;
    }
    #toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        flex-direction: row;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 12px;
      }
      .sidebar-brand { margin: 0; padding: 0; }
      .nav-btn { width: auto; margin: 0; }
      .main-content { padding: 20px 16px; }
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <div id="modal-root" class="modal-backdrop" style="display:none;" onclick="if(event.target===this)closeModal()"></div>
  <div id="toast-msg"></div>

  <script src="/js/app.js"></script>
</body>
</html>
